name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MY_PRIVATE_KEY_1 }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Init submodules
        run: git submodule update --init --recursive --depth 1 simulation_core

      - name: Verify submodule checkout
        run: |
          test -f simulation_core/3rdparty/infrastructure/CMakeLists.txt
          test -d simulation_core/assets/database/materials

      - name: Verify Hugging Face SSH access
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
        run: |
          set -euxo pipefail
          git lfs install
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/huggingface/xet-core/refs/heads/main/git_xet/install.sh | sh
          git xet install
          git xet --version
          HF_REPO="git@hf.co:spaces/simulation-toykits/v1"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          echo ">>> SSH_AUTH_SOCK=${SSH_AUTH_SOCK:-unset}"
          echo ">>> Probing git@hf.co ..."
          if ! ssh "${SSH_OPTS[@]}" -T git@hf.co; then
            rc=$?
            echo ">>> ssh -T exit code: ${rc}"
            test "${rc}" -eq 1
          fi
          echo ">>> git ls-remote ${HF_REPO} HEAD"
          git ls-remote "${HF_REPO}" HEAD
          echo ">>> HF Space reachable"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-20 \
            llvm-20-dev \
            pkg-config \
            libboost-all-dev \
            libeigen3-dev \
            libfftw3-dev \
            python3-venv \
            python3-dev \
            libopenmpi-dev \
            git-lfs
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Create venv and install Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir -r requirements.txt

      - name: Configure and build (Release, minimal)
        working-directory: simulation_core
        run: |
          source 3rdparty/infrastructure/scripts/init-inf-build-env.sh
          source ../.venv/bin/activate
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)" --target simulation test_diffraction

      - name: Collect runtime artifacts to .simulation_core
        working-directory: simulation_core
        run: |
          source ../.venv/bin/activate
          python scripts/collect_simulation.py -b build -o ../.simulation_core
          cp build/test_diffraction ../.simulation_core/
          test -d ../.simulation_core/simulation_plugins
          test -f ../.simulation_core/simulation_plugins/filmstack_visualizer.py
          test -f ../.simulation_core/simulation_plugins/simulation_paths.py

      - name: Smoke import simulation.so
        run: |
          source .venv/bin/activate
          source scripts/init-toykits-build-env.sh
          cd "${{ github.workspace }}"
          python -c "
          import simulation
          import filmstack_visualizer
          print('OK')
          "

      - name: Run tests
        run: |
          source .venv/bin/activate
          source scripts/init-toykits-build-env.sh
          cd "${{ github.workspace }}"
          python scripts/check_import_contract.py
          python -m pytest test/ -v --tb=short
          python -m pytest simulation_core/tests/test_gen_sweep_table.py -q --tb=short

      - name: Deploy to Hugging Face Space
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          PYTHONUNBUFFERED: "1"
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
          HF_ENDPOINT: https://huggingface.co
        run: |
          set -euxo pipefail
          git lfs install
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/huggingface/xet-core/refs/heads/main/git_xet/install.sh | sh
          git xet install
          source .venv/bin/activate
          python scripts/deploy.py hf
