name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SIMULATION_DATABASE_KEY: ${{ secrets.SIMULATION_DATABASE_KEY }}

    steps:
      - name: Install SSH Key
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MY_PRIVATE_KEY_1 }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Verify Hugging Face SSH access
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
        run: |
          set -euxo pipefail
          HF_REPO="git@hf.co:spaces/simulation-toykits/v1"
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          if ! ssh "${SSH_OPTS[@]}" -T git@hf.co; then
            rc=$?
            test "${rc}" -eq 1
          fi
          git ls-remote "${HF_REPO}" HEAD

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-dev \
            curl \
            git
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Create venv and install Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install --no-cache-dir -r requirements.txt

      - name: Require database encryption key
        run: |
          set -euo pipefail
          if [[ -z "${SIMULATION_DATABASE_KEY:-}" ]]; then
            echo ">>> 错误: 请在 GitHub secrets 中配置 SIMULATION_DATABASE_KEY" >&2
            exit 1
          fi
          echo ">>> database key: SIMULATION_DATABASE_KEY"

      - name: Download latest runtime artifacts
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python scripts/build_toykits.py --download_toolkits
          test -f .simulation_toolkits/simulation.so
          test -d .simulation_toolkits/simulation_plugins
          test -f .simulation_toolkits/assets/database.bin
          test ! -d .simulation_toolkits/assets/database
          echo "$(pwd)/.simulation_toolkits" | sudo tee /etc/ld.so.conf.d/99-simulation-toolkits.conf
          sudo ldconfig

      - name: Verify runtime and run tests
        run: |
          source .venv/bin/activate
          source scripts/init-toykits-build-env.sh
          set -euo pipefail
          test -f "${SIMULATION_ARTIFACTS_DIR}/assets/database.bin"
          python -c "
          import simulation
          import filmstack_visualizer
          print('OK')
          "
          python scripts/check_import_contract.py
          python -m pytest test/ -v --tb=short

      - name: Deploy to Hugging Face Space
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          PYTHONUNBUFFERED: "1"
          GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
          HF_ENDPOINT: https://huggingface.co
        run: |
          set -euxo pipefail
          source .venv/bin/activate
          python scripts/build_toykits.py hf
